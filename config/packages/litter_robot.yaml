# Litter-Robot waste drawer and hopper alerts.
#
# Both mirror the Washer Done / Dryer Done pattern in automations.yaml (push
# via notify.household + TTS to the living room display and family room
# speaker, gated on quiet hours), with one difference: they REPEAT as a
# reminder until the underlying condition clears.
#
# Drawer: two independent "full" signals, whichever lands first:
#   - sensor.litter_robot_4_waste_drawer crosses a configurable percentage
#   - sensor.litter_robot_4_status_code reports a drawer-full code
#     (df1 = ~2 cycles left, df2 = ~1 left, dfs = stopped, drawer full)
# The percentage gives early warning and is tunable; the status codes are the
# robot's own verdict and catch the case where it refuses to cycle at an
# unexpected fill level.
#
# Hopper: sensor.litter_robot_4_hopper_status reporting litter_low (early
# warning) or empty (can't refill the globe). Shares the drawer's reminder
# interval (input_number.litter_drawer_reminder_minutes) rather than adding
# a second tunable for the same robot's nagging cadence.

input_number:
  litter_drawer_threshold_pct:
    name: Litter Drawer Alert Threshold
    icon: mdi:gauge-full
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

  litter_drawer_reminder_minutes:
    name: Litter Drawer Reminder Interval
    icon: mdi:bell-ring-outline
    min: 15
    max: 720
    step: 15
    unit_of_measurement: min
    mode: box

automation:
  - id: litter_robot_drawer_full
    alias: Litter Robot — Drawer Full Reminder
    description: >-
      Alerts when the waste drawer passes the configured fill threshold or the
      robot reports a drawer-full status, then repeats on the configured
      interval until the drawer is emptied.
    triggers:
      # Drawer crosses the configurable fill threshold.
      - trigger: numeric_state
        entity_id: sensor.litter_robot_4_waste_drawer
        above: input_number.litter_drawer_threshold_pct
      # The robot itself reports the drawer is full.
      - trigger: state
        entity_id: sensor.litter_robot_4_status_code
        to:
          - df1
          - df2
          - dfs
      # Quiet hours ending re-arms the reminder loop, which the `while` below
      # exits when quiet hours start.
      - trigger: state
        entity_id: input_boolean.quiet_hours
        to: "off"
      # A restart cancels any in-flight repeat loop, so re-arm on start too.
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.litter_robot_4_waste_drawer') | float(0)
               >= states('input_number.litter_drawer_threshold_pct') | float(85)
             or states('sensor.litter_robot_4_status_code') in ['df1', 'df2', 'dfs'] }}
      - condition: state
        entity_id: input_boolean.quiet_hours
        state: "off"
    actions:
      - repeat:
          while:
            # Re-evaluated every pass, so emptying the drawer (or quiet hours
            # starting) ends the reminders without needing a separate automation.
            - condition: template
              value_template: >-
                {{ states('sensor.litter_robot_4_waste_drawer') | float(0)
                     >= states('input_number.litter_drawer_threshold_pct') | float(85)
                   or states('sensor.litter_robot_4_status_code') in ['df1', 'df2', 'dfs'] }}
            - condition: state
              entity_id: input_boolean.quiet_hours
              state: "off"
          sequence:
            - variables:
                drawer_msg: >-
                  The litter robot waste drawer is
                  {{ states('sensor.litter_robot_4_waste_drawer') | int(0) }} percent full.
                  Time to empty it.
            - action: notify.household
              data:
                title: Litter Drawer Full
                message: "{{ drawer_msg }}"
            - action: tts.speak
              target:
                entity_id: tts.google_translate_en_com
              data:
                media_player_entity_id: media_player.living_room_display
                message: "{{ drawer_msg }}"
                cache: false
            - action: media_player.volume_set
              target:
                entity_id: media_player.family_room_wifi
              data:
                volume_level: 0.8
            - action: tts.speak
              target:
                entity_id: tts.google_translate_en_com
              data:
                media_player_entity_id: media_player.family_room_wifi
                message: "{{ drawer_msg }}"
                cache: false
            - delay:
                minutes: >-
                  {{ states('input_number.litter_drawer_reminder_minutes') | int(120) }}
    mode: single
    # Triggers firing while the reminder loop is already running are expected
    # and harmless; don't log them as warnings.
    max_exceeded: silent

  - id: litter_robot_hopper_empty
    alias: Litter Robot — Hopper Empty Reminder
    description: >-
      Alerts when the litter hopper reports low or empty, then repeats on
      the shared litter_drawer_reminder_minutes interval until it's refilled.
      Same shape as litter_robot_drawer_full.
    triggers:
      # The hopper's own verdict: litter_low is the early warning, empty
      # means it can no longer top off the globe.
      - trigger: state
        entity_id: sensor.litter_robot_4_hopper_status
        to:
          - litter_low
          - empty
      # Quiet hours ending re-arms the reminder loop, which the `while` below
      # exits when quiet hours start.
      - trigger: state
        entity_id: input_boolean.quiet_hours
        to: "off"
      # A restart cancels any in-flight repeat loop, so re-arm on start too.
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: sensor.litter_robot_4_hopper_status
        state:
          - litter_low
          - empty
      - condition: state
        entity_id: input_boolean.quiet_hours
        state: "off"
    actions:
      - repeat:
          while:
            # Re-evaluated every pass, so refilling the hopper (or quiet
            # hours starting) ends the reminders without a separate automation.
            - condition: state
              entity_id: sensor.litter_robot_4_hopper_status
              state:
                - litter_low
                - empty
            - condition: state
              entity_id: input_boolean.quiet_hours
              state: "off"
          sequence:
            - variables:
                hopper_msg: >-
                  {% if states('sensor.litter_robot_4_hopper_status') == 'empty' %}
                    The litter robot hopper is empty. It can't refill the globe.
                  {% else %}
                    The litter robot hopper is running low on litter.
                  {% endif %}
            - action: notify.household
              data:
                title: Litter Hopper Low
                message: "{{ hopper_msg }}"
            - action: tts.speak
              target:
                entity_id: tts.google_translate_en_com
              data:
                media_player_entity_id: media_player.living_room_display
                message: "{{ hopper_msg }}"
                cache: false
            - action: media_player.volume_set
              target:
                entity_id: media_player.family_room_wifi
              data:
                volume_level: 0.8
            - action: tts.speak
              target:
                entity_id: tts.google_translate_en_com
              data:
                media_player_entity_id: media_player.family_room_wifi
                message: "{{ hopper_msg }}"
                cache: false
            - delay:
                minutes: >-
                  {{ states('input_number.litter_drawer_reminder_minutes') | int(120) }}
    mode: single
    # Triggers firing while the reminder loop is already running are expected
    # and harmless; don't log them as warnings.
    max_exceeded: silent
