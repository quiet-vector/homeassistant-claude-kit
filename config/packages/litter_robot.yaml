# Litter-Robot waste drawer alerts.
#
# Mirrors the Washer Done / Dryer Done pattern in automations.yaml (push via
# notify.household + TTS to the living room display and family room speaker,
# gated on quiet hours), with one difference: this one REPEATS as a reminder
# until the drawer is actually emptied.
#
# Two independent "full" signals, whichever lands first:
#   - sensor.litter_robot_4_waste_drawer crosses a configurable percentage
#   - sensor.litter_robot_4_status_code reports a drawer-full code
#     (df1 = ~2 cycles left, df2 = ~1 left, dfs = stopped, drawer full)
# The percentage gives early warning and is tunable; the status codes are the
# robot's own verdict and catch the case where it refuses to cycle at an
# unexpected fill level.

input_number:
  litter_drawer_threshold_pct:
    name: Litter Drawer Alert Threshold
    icon: mdi:gauge-full
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

  litter_drawer_reminder_minutes:
    name: Litter Drawer Reminder Interval
    icon: mdi:bell-ring-outline
    min: 15
    max: 720
    step: 15
    unit_of_measurement: min
    mode: box

automation:
  - id: litter_robot_drawer_full
    alias: Litter Robot — Drawer Full Reminder
    description: >-
      Alerts when the waste drawer passes the configured fill threshold or the
      robot reports a drawer-full status, then repeats on the configured
      interval until the drawer is emptied.
    triggers:
      # Drawer crosses the configurable fill threshold.
      - trigger: numeric_state
        entity_id: sensor.litter_robot_4_waste_drawer
        above: input_number.litter_drawer_threshold_pct
      # The robot itself reports the drawer is full.
      - trigger: state
        entity_id: sensor.litter_robot_4_status_code
        to:
          - df1
          - df2
          - dfs
      # Quiet hours ending re-arms the reminder loop, which the `while` below
      # exits when quiet hours start.
      - trigger: state
        entity_id: input_boolean.quiet_hours
        to: "off"
      # A restart cancels any in-flight repeat loop, so re-arm on start too.
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.litter_robot_4_waste_drawer') | float(0)
               >= states('input_number.litter_drawer_threshold_pct') | float(85)
             or states('sensor.litter_robot_4_status_code') in ['df1', 'df2', 'dfs'] }}
      - condition: state
        entity_id: input_boolean.quiet_hours
        state: "off"
    actions:
      - repeat:
          while:
            # Re-evaluated every pass, so emptying the drawer (or quiet hours
            # starting) ends the reminders without needing a separate automation.
            - condition: template
              value_template: >-
                {{ states('sensor.litter_robot_4_waste_drawer') | float(0)
                     >= states('input_number.litter_drawer_threshold_pct') | float(85)
                   or states('sensor.litter_robot_4_status_code') in ['df1', 'df2', 'dfs'] }}
            - condition: state
              entity_id: input_boolean.quiet_hours
              state: "off"
          sequence:
            - variables:
                drawer_msg: >-
                  The litter robot waste drawer is
                  {{ states('sensor.litter_robot_4_waste_drawer') | int(0) }} percent full.
                  Time to empty it.
            - action: notify.household
              data:
                title: Litter Drawer Full
                message: "{{ drawer_msg }}"
            - action: tts.speak
              target:
                entity_id: tts.google_translate_en_com
              data:
                media_player_entity_id: media_player.living_room_display
                message: "{{ drawer_msg }}"
                cache: false
            - action: media_player.volume_set
              target:
                entity_id: media_player.family_room_wifi
              data:
                volume_level: 0.8
            - action: tts.speak
              target:
                entity_id: tts.google_translate_en_com
              data:
                media_player_entity_id: media_player.family_room_wifi
                message: "{{ drawer_msg }}"
                cache: false
            - delay:
                minutes: >-
                  {{ states('input_number.litter_drawer_reminder_minutes') | int(120) }}
    mode: single
    # Triggers firing while the reminder loop is already running are expected
    # and harmless; don't log them as warnings.
    max_exceeded: silent
